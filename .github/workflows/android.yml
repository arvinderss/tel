name: Build, test & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    env:
      TEL_VERSION_CODE: ${{ github.run_number }}
      TEL_VERSION_NAME: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (mileage, amount/rate/volume, CSV, units, validation)
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee unit.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease 2>&1 | tee release.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          cat unit.log release.log 2>/dev/null | grep -E "^e: |^> |FAILED|Could not|error:|Exception|expected" | grep -v "^> Task" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          find app/build/test-results -name '*.xml' 2>/dev/null | xargs -r grep -h -A2 "<failure" | head -30 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Check the APK has no network permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|CAMERA|ACCESS_FINE_LOCATION|READ_EXTERNAL_STORAGE)" permissions.txt; then
            echo "Unexpected permission in APK"; exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tel-${TEL_VERSION_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tel-apk
          path: tel-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TEL_VERSION_NAME }}
          name: Tel ${{ env.TEL_VERSION_NAME }}
          body: |
            Offline fuel, mileage and cost tracker for Android.
            Install `tel-${{ env.TEL_VERSION_NAME }}.apk` (allow installs from this source when Android asks).
            The app has no internet or storage permission; all data stays on the device (plus an optional CSV copy in a file you choose).
          files: tel-*.apk
          make_latest: true

  instrumented:
    name: Device tests (database, migration, CSV copy, UI flow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest > device.log 2>&1 || (grep -E "TELTEST|^e: |FAILED|Exception|expected|Error|failed|at app\.tel" device.log | head -40 | sed 's/^/::error::/'; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
