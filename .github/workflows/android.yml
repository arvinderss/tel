name: Build, test & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    env:
      TEL_VERSION_CODE: ${{ github.run_number }}
      TEL_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (calculations, units, validation, OCR parsing)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK has no network permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|CAMERA|ACCESS_FINE_LOCATION|READ_EXTERNAL_STORAGE)" permissions.txt; then
            echo "Unexpected permission in APK"; exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tel-${TEL_VERSION_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tel-apk
          path: tel-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TEL_VERSION_NAME }}
          name: Tel ${{ env.TEL_VERSION_NAME }}
          body: |
            Offline fuel, mileage and cost tracker for Android.
            Install `tel-${{ env.TEL_VERSION_NAME }}.apk` (allow installs from this source when Android asks).
            The app has no internet permission; all data and OCR stay on the device.
          files: tel-*.apk
          make_latest: true

  instrumented:
    name: Device tests (database, backup, UI flow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
